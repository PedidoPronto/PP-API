services:
  db:
    image: postgres:15-alpine
    container_name: pedidopronto-db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: 
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: pedidopronto-api
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app                 
      - /app/node_modules      
    command: >
      sh -c "npx prisma generate && npx prisma migrate deploy && pnpm run start:dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: